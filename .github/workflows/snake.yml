name: Generate snake animation

on:
  schedule: # execute every 12 hours
    - cron: "* */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: dist/snake.svg?palette=custom&color_snake=%23001133&color_dots=%23001133,%23002244,%23003355,%23004466

      - name: change background color to midnight blue
        run: |
          # replace black background (#000000 or rgb(0,0,0)) with #001133
          sed -i 's/fill="#000000"/fill="#001133"/g' dist/snake.svg
          sed -i 's/fill:#000000/fill:#001133/g' dist/snake.svg
          sed -i 's/fill="black"/fill="#001133"/g' dist/snake.svg

      - name: push snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
